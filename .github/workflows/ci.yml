name: CI - Build and Push to ECR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/careerlens-backend:$IMAGE_TAG \
            -t $ECR_REGISTRY/careerlens-backend:latest \
            ./backend
          docker push $ECR_REGISTRY/careerlens-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/careerlens-backend:latest
          echo "Backend pushed: $ECR_REGISTRY/careerlens-backend:$IMAGE_TAG"

      - name: Build and push frontend
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/careerlens-frontend:$IMAGE_TAG \
            -t $ECR_REGISTRY/careerlens-frontend:latest \
            ./frontend
          docker push $ECR_REGISTRY/careerlens-frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/careerlens-frontend:latest
          echo "Frontend pushed: $ECR_REGISTRY/careerlens-frontend:$IMAGE_TAG"
