name: CD - Deploy to EKS

on:
  workflow_run:
    workflows: ["CI - Build and Push to ECR"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install kubectl
        uses: azure/setup-kubectl@v3

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name careerlens \
            --region ${{ secrets.AWS_REGION }}

      - name: Deploy backend
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          kubectl set image deployment/backend \
            backend=$ECR_REGISTRY/careerlens-backend:$IMAGE_TAG \
            -n dev
          kubectl rollout status deployment/backend -n dev --timeout=120s
          echo "Backend deployed!"

      - name: Deploy frontend
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          kubectl set image deployment/frontend \
            frontend=$ECR_REGISTRY/careerlens-frontend:$IMAGE_TAG \
            -n dev
          kubectl rollout status deployment/frontend -n dev --timeout=120s
          echo "Frontend deployed!"

      - name: Verify pods healthy
        run: |
          kubectl wait --for=condition=ready pod \
            -l app=backend -n dev --timeout=120s
          kubectl wait --for=condition=ready pod \
            -l app=frontend -n dev --timeout=120s
          kubectl get pods -n dev
          echo "All pods healthy! Deployment complete!"
